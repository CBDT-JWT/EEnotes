  <div class="notes-toolbar">
    <nav class="notes-toolbar__inner" aria-label="笔记工具栏">
      <label class="md-icon notes-drawer-toggle" for="__drawer" aria-label="打开课程目录" tabindex="0" role="button">
        {% include ".icons/material/menu.svg" %}<span class="notes-drawer-label">课程目录</span>
      </label>
      <a class="notes-home" href="{{ nav.homepage.url | url }}">学习笔记</a>
      {% if "search" in config.plugins %}
        {% set search = config.plugins["search"] | attr("config") %}
        {% if search.enabled %}
          {% include "partials/search.html" %}
        {% endif %}
      {% endif %}
      <a class="notes-repo md-icon" href="{{ config.repo_url }}" aria-label="在 GitHub 查看笔记源码" title="笔记源码">
        {% include ".icons/fontawesome/brands/github.svg" %}
      </a>
    </nav>
  </div>
